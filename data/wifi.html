<!DOCTYPE html>
<html lang='en'>

<head>
    <meta name='format-detection' content='telephone=no'>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no' />
    <link rel="stylesheet" type="text/css" href="portal.css">
    <title>Wifi Config</title>
    <script>
        function f() { var x = document.getElementById('p'); x.type === 'password' ? x.type = 'text' : x.type = 'password'; }
    </script>
</head>

<body class='invert'>
    <div class='wrap'>
        <h2>Current SSID: %CURRENT_SSID%</h2>
<br />
        <form method='POST' action='#'>
            <select id='wifis' name="selected">
                %SSID_LIST%
            </select>
            <input type="submit" value="Select" formaction="/wifiset">
            <input type="submit" value="Delete" formaction="/wifidelete" class='D'>
        </form>
<br />
<br />
        <form method='POST' action='/wifisave'>
            <label for='s'>SSID</label>
            <input id='s' name="ssid" maxlength='32' autocorrect='off' autocapitalize='none' placeholder=''>
            <br />
            <label for='p'>Password</label>
            <input id='p' name="pwd" maxlength='64' type='password' placeholder=''>
            <input type='checkbox' id='showpass' onclick='f()'>
            <label for='showpass'>Show Password</label>
            <br /><br /><br />
            <button type='submit'>Register credentials</button>
        </form>

    </div>
</body>

</html>
