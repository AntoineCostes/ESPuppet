<!DOCTYPE html>
<html lang='en'>

<head>
  <meta name='format-detection' content='telephone=no'>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no' />
  <link rel="stylesheet" type="text/css" href="portal.css">
  <title>ESPuppet Config</title>
  
</head>
<body class='invert'>
  <div class='wrap'>
    
    <h2>Current config:  %CONFIG%</h2>

    <form action="/loadconfig" method='post'>
      <select id='configs' name="config">
        %CONFIG_OPTIONS%
      </select>
      <input type="submit" value="Download" formaction="/download">
      <input type="submit" value="Load and reboot" formaction="/load">
      <input type="submit" value="Delete" formaction="/delete">
    </form>
    <br/>
    <br/>
  <p><h2>File Upload</h2>
  </p>
  <form method="POST" action="/upload" enctype="multipart/form-data">
    <input type="file" name="data"/>
    <input type="submit" name="upload" value="Upload" title="Upload File">
  </form>

  </div>
</body>

</html>
