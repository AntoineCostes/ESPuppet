<!DOCTYPE html>
<html lang='en'>

<head>
  <meta name='format-detection' content='telephone=no'>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no' />
  <link rel="stylesheet" type="text/css" href="portal.css">
  <title>ESPuppet Rebooting</title>
  
</head>

<body class='invert'>
  <!-- <div class='wrap'> -->
    
  Rebooting, returning to <span id="hostname">%HOSTNAME%</span> <br/>
  in <span id="countdown">10</span> seconds

<script type="text/javascript">
  var seconds = 10;
  function countdown() {
    seconds = seconds - 1;
    if (seconds < 0) {
      window.location.href = "http://"+document.getElementById("hostname").innerHTML;
    } else {
      document.getElementById("countdown").innerHTML = seconds;
      window.setTimeout("countdown()", 1000);
    }
  }
  countdown();
</script>
  <!-- </div> -->
</body>

</html>
