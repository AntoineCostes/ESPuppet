<h3>
  Rebooting, returning to main page in <span id="countdown">10</span> seconds
</h3>
<script type="text/javascript">
  var seconds = 10;
  function countdown() {
    seconds = seconds - 1;
    if (seconds < 0) {
      window.location = "/";
    } else {
      document.getElementById("countdown").innerHTML = seconds;
      window.setTimeout("countdown()", 1000);
    }
  }
  countdown();
</script>
